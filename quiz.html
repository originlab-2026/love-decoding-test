<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>答题 - 心理测试</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">爱的解码测试</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="javascript:void(0)" onclick="navigateWithFallback('catalog', this)">测试合集</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container">
        <!-- 顶部信息栏 -->
        <div style="background: white; border-radius: 16px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
            <!-- 进度条 -->
            <div style="padding-top: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <span style="font-size: 0.85rem; color: #888; font-weight: 500;">答题进度</span>
                    <span style="font-size: 1rem; color: #FF8C94; font-weight: 700;"><span id="current-num">1</span><span style="color: #ccc; margin: 0 3px;">/</span><span id="total-num" style="color: #999; font-weight: 500;">-</span></span>
                </div>
                <!-- 小猫走路进度条 -->
                <div id="progress-container" style="position: relative; height: 15px; border-radius: 12px; overflow: visible; background: #e8f5e9; margin-top: 40px;">
                    <!-- 草地背景 (预加载) -->
                    <picture>
                        <source srcset="assets/progress bar/草地进度条.webp" type="image/webp">
                        <source srcset="assets/progress bar/草地进度条.png" type="image/png">
                        <img src="assets/progress bar/草地进度条.png?v=2" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; z-index: 5;" alt="草地" loading="eager" fetchpriority="high">
                    </picture>
                    <!-- 进度遮罩 -->
                    <div id="progress-mask" style="position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: rgba(255,255,255,0.3); transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 6; border-radius: 12px;"></div>
                    <!-- 小猫 -->
                    <div id="cat-walker" style="position: absolute; bottom: 0; transform: translateX(-50%); left: 0%; transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 4;">
                        <img id="cat-frame" src="assets/progress bar/进度条小猫1.png?v=3" style="width: 40px; height: 40px; object-fit: contain; display: block;" alt="小猫" loading="eager" fetchpriority="high">
                    </div>
                </div>
            </div>
        </div>

        <!-- 题目卡片 -->
        <div class="card fade-in">
            <div id="question-container">
                <!-- 动态生成题目 -->
            </div>

            <!-- 导航按钮 -->
            <div class="nav-buttons">
                <button class="btn btn-secondary" id="prev-btn" disabled>上一题</button>
                <button class="btn btn-primary" id="next-btn" disabled>下一题</button>
                <button class="btn btn-primary hidden" id="submit-btn">提交</button>
            </div>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/deploy-config.js"></script>
    <script>
        // 全局变量
        let quizData = null;
        let allQuestions = [];
        let currentQuestionIndex = 0;
        let answers = {};
        let isTransitioning = false; // 防止重复点击标志

        // 打乱数组顺序（Fisher-Yates 算法）
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 加载测试数据
        async function loadQuizData() {
            try {
                quizData = StorageUtil.get(StorageKeys.QUIZ_DATA);
                
                // 检查 localStorage 数据是否有效
                if (quizData && (!quizData.scale_questions || !quizData.choice_questions)) {
                    console.warn('localStorage 数据损坏，清除后重新加载');
                    StorageUtil.remove(StorageKeys.QUIZ_DATA);
                    quizData = null;
                }
                
                if (!quizData) {
                    // 使用相对路径加载数据
                    const jsonUrl = 'data/default-quiz.json';
                    console.log('尝试加载:', jsonUrl);
                    
                    try {
                        const response = await fetch(jsonUrl);
                        if (response.ok) {
                            quizData = await response.json();
                            StorageUtil.set(StorageKeys.QUIZ_DATA, quizData);
                            console.log('成功从服务器加载数据');
                        } else {
                            throw new Error('HTTP ' + response.status);
                        }
                    } catch (fetchError) {
                        console.error('无法加载 JSON 文件:', fetchError);
                        document.getElementById('question-container').innerHTML = `
                            <div class="alert alert-error">
                                <strong>加载测试数据失败</strong><br>
                                无法访问: ${jsonUrl}<br>
                                错误: ${fetchError.message}<br><br>
                                当前页面URL: ${window.location.href}<br>
                                请确保通过 http://localhost:8080 访问本站<br>
                                <a href="index.html">返回首页</a>
                            </div>
                        `;
                        return;
                    }
                }

                // 再次检查数据完整性
                if (!quizData || !quizData.scale_questions || !quizData.choice_questions) {
                    throw new Error('Invalid quiz data structure');
                }

                // 打乱量表题和选择题各自的顺序，然后合并（量表题在前，选择题在后）
                const shuffledScales = shuffleArray([...quizData.scale_questions]).map(q => ({ ...q, type: 'scale' }));
                const shuffledChoices = shuffleArray([...quizData.choice_questions]).map(q => ({ ...q, type: 'choice' }));
                allQuestions = [...shuffledScales, ...shuffledChoices];

                // 恢复进度
                const savedIndex = StorageUtil.get(StorageKeys.CURRENT_QUESTION, 0);
                const savedAnswers = StorageUtil.get(StorageKeys.USER_ANSWERS, {});
                currentQuestionIndex = Math.min(savedIndex, allQuestions.length - 1);
                answers = savedAnswers;

                // 更新总题数显示
                document.getElementById('total-num').textContent = allQuestions.length;

                // 显示当前题目
                renderQuestion();
                updateProgress();

            } catch (error) {
                console.error('加载测试数据失败:', error);
                document.getElementById('question-container').innerHTML = `
                    <div class="alert alert-error">
                        加载测试数据失败，请<a href="index.html">返回首页</a>重试
                    </div>
                `;
            }
        }

        // 渲染题目
        function renderQuestion() {
            const question = allQuestions[currentQuestionIndex];
            const container = document.getElementById('question-container');
            const hasAnswer = answers[question.question_id] !== undefined;

            let html = `
                <div class="fade-in">
                    <span style="display: inline-block; padding: 4px 12px; background: var(--secondary-color); 
                                 color: var(--primary-color); border-radius: 20px; font-size: 0.875rem; margin-bottom: 16px;">
                        ${question.type === 'scale' ? '量表题' : '选择题'}
                    </span>
                    <h2 style="margin-bottom: 32px; font-size: 1.25rem; line-height: 1.6;">
                        ${currentQuestionIndex + 1}. ${question.question_text}
                    </h2>
            `;

            if (question.type === 'scale') {
                // 量表题 - 5个选项（横向排列，无数字）
                const scaleLabels = ['非常不同意', '不同意', '中立', '同意', '非常同意'];
                html += `<div class="scale-options" id="scale-options">`;
                for (let i = 1; i <= 5; i++) {
                    const selected = answers[question.question_id] === i ? 'selected' : '';
                    html += `
                        <div class="scale-btn scale-option ${selected}" data-value="${i}">
                            <span style="font-size: 0.875rem; font-weight: 500; text-align: center; line-height: 1.3;">${scaleLabels[i-1]}</span>
                        </div>
                    `;
                }
                html += `</div>`;
            } else {
                // 选择题 - A-E 选项（多选，无勾选框，随机打乱）
                let options = ['a', 'b', 'c', 'd', 'e'];
                // 过滤掉没有文本或维度的选项
                options = options.filter(opt => {
                    const text = question[`option_${opt}_text`];
                    const dim = question[`option_${opt}_dim`];
                    return text && dim;
                });
                // 随机打乱选项顺序
                options = options.sort(() => Math.random() - 0.5);
                
                // 获取当前已选答案（数组）
                const currentAnswers = answers[question.question_id] || [];
                html += `<div class="radio-group" id="choice-options">`;
                html += `<p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 12px;">💡 可多选（最多3个）</p>`;
                options.forEach((opt, idx) => {
                    const text = question[`option_${opt}_text`];
                    const selected = currentAnswers.includes(opt) ? 'selected' : '';
                    html += `
                        <div class="radio-item choice-option ${selected}" data-option="${opt}" style="cursor: pointer;">
                            <span class="radio-label">${String.fromCharCode(65 + idx)}. ${text}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            html += `</div>`;
            container.innerHTML = html;

            // 更新按钮状态
            updateButtons();
        }

        // 选择量表题答案（单选，选择后自动跳转）
        function selectScale(value) {
            // 防止重复点击
            if (isTransitioning) return;
            
            const question = allQuestions[currentQuestionIndex];
            const isLast = currentQuestionIndex === allQuestions.length - 1;
            
            // 先更新数据
            answers[question.question_id] = value;
            saveProgress();
            
            // 直接更新当前选项的样式，不重新渲染整个题目
            const options = document.querySelectorAll('.scale-option');
            options.forEach((opt, idx) => {
                if (idx + 1 === value) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
            updateButtons();
            
            // 量表题选择后自动跳转到下一题（如果不是最后一题）
            if (!isLast) {
                isTransitioning = true; // 设置标志，防止重复点击
                setTimeout(() => {
                    currentQuestionIndex++;
                    saveProgress();
                    renderQuestion();
                    updateProgress();
                    isTransitioning = false; // 重置标志
                }, 400); // 延迟400ms让用户看到选择效果
            } else {
                // 最后一题，重新渲染以显示提交按钮
                renderQuestion();
            }
        }

        // 切换选择题答案（多选，点击切换选中状态，不自动跳转，最多选3个）
        function toggleChoice(value) {
            // 防止重复点击
            if (isTransitioning) return;
            
            const question = allQuestions[currentQuestionIndex];
            // 获取当前已选答案（数组）
            let currentAnswers = answers[question.question_id] || [];
            
            // 切换选中状态
            const isSelected = currentAnswers.includes(value);
            if (isSelected) {
                // 如果已选中，则取消选中
                currentAnswers = currentAnswers.filter(v => v !== value);
            } else {
                // 如果未选中，检查是否已达到最大选择数（3个）
                if (currentAnswers.length >= 3) {
                    alert('最多只能选择3个选项');
                    return;
                }
                // 如果未选中，则添加选中
                currentAnswers.push(value);
            }
            
            // 保存答案（如果是空数组则删除该题的答案记录）
            if (currentAnswers.length === 0) {
                delete answers[question.question_id];
            } else {
                answers[question.question_id] = currentAnswers;
            }
            
            saveProgress();
            
            // 直接更新当前选项的样式，不重新渲染整个题目
            const clickedOption = document.querySelector(`.choice-option[data-option="${value}"]`);
            if (clickedOption) {
                if (isSelected) {
                    clickedOption.classList.remove('selected');
                } else {
                    clickedOption.classList.add('selected');
                }
            }
            
            updateButtons();
            // 选择题不自动跳转，等待用户点击下一题按钮
        }

        // 保存进度
        function saveProgress() {
            StorageUtil.set(StorageKeys.USER_ANSWERS, answers);
            StorageUtil.set(StorageKeys.CURRENT_QUESTION, currentQuestionIndex);
        }

        // 小猫走路动画
        let catAnimationInterval = null;
        let currentCatFrame = 1;
        // 预加载小猫图片到内存（使用固定版本号避免缓存问题）
        const catImages = {
            1: new Image(),
            2: new Image()
        };
        catImages[1].src = 'assets/progress bar/进度条小猫1.png?v=3';
        catImages[2].src = 'assets/progress bar/进度条小猫2.png?v=3';
                
        function startCatAnimation() {
            if (catAnimationInterval) return;
            catAnimationInterval = setInterval(() => {
                currentCatFrame = currentCatFrame === 1 ? 2 : 1;
                // 使用预加载的图片路径
                document.getElementById('cat-frame').src = catImages[currentCatFrame].src;
            }, 200); // 每 200ms 切换一次，快速走路效果
        }
        
        function stopCatAnimation() {
            if (catAnimationInterval) {
                clearInterval(catAnimationInterval);
                catAnimationInterval = null;
            }
        }
        
        // 更新进度显示
        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / allQuestions.length) * 100;
            const catPosition = Math.min(progress, 95); // 小猫最多走到95%，不要超出边界
            document.getElementById('progress-mask').style.width = progress + '%';
            document.getElementById('cat-walker').style.left = catPosition + '%';
            document.getElementById('current-num').textContent = currentQuestionIndex + 1;
        }

        // 更新按钮状态
        function updateButtons() {
            const question = allQuestions[currentQuestionIndex];
            // 检查是否有答案（量表题是单个值，选择题是数组）
            let hasAnswer = false;
            const answer = answers[question.question_id];
            if (question.type === 'scale') {
                hasAnswer = answer !== undefined;
            } else {
                // 选择题需要至少选中一个
                hasAnswer = Array.isArray(answer) && answer.length > 0;
            }
            const isLast = currentQuestionIndex === allQuestions.length - 1;

            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-btn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (isLast) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
                submitBtn.disabled = !hasAnswer;
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
                nextBtn.disabled = !hasAnswer;
            }
            
            console.log('updateButtons:', { type: question.type, hasAnswer, isLast, answer });
        }

        // 上一题
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                saveProgress();
                renderQuestion();
                updateProgress();
            }
        });

        // 下一题
        document.getElementById('next-btn').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            console.log('下一题按钮被点击', currentQuestionIndex);
            
            // 防止重复点击
            if (isTransitioning) return;
            
            // 检查当前题是否已作答
            const question = allQuestions[currentQuestionIndex];
            const answer = answers[question.question_id];
            let hasAnswer = false;
            if (question.type === 'scale') {
                hasAnswer = answer !== undefined;
            } else {
                hasAnswer = Array.isArray(answer) && answer.length > 0;
            }
            
            if (!hasAnswer) {
                alert('请先回答当前题目');
                return;
            }
            
            if (currentQuestionIndex < allQuestions.length - 1) {
                isTransitioning = true; // 设置标志
                currentQuestionIndex++;
                saveProgress();
                renderQuestion();
                updateProgress();
                // 短暂延迟后重置标志，防止快速连续点击
                setTimeout(() => {
                    isTransitioning = false;
                }, 300);
            }
        });

        // 提交
        document.getElementById('submit-btn').addEventListener('click', () => {
            // 检查是否全部答完
            const answeredCount = Object.keys(answers).length;
            if (answeredCount < allQuestions.length) {
                alert(`还有 ${allQuestions.length - answeredCount} 题未作答，请完成所有题目后再提交`);
                return;
            }

            // 保存答案并跳转到结果页
            StorageUtil.set(StorageKeys.USER_ANSWERS, answers);
            window.location.href = 'result.html';
        });

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            applyUIConfig();
            loadQuizData();
            startCatAnimation(); // 启动小猫走路动画
            
            // 检测当前部署平台并记录日志
            const platform = detectDeployPlatform();
            console.log('当前部署平台:', platform);
            console.log('当前部署URL:', getCurrentDeployUrl());
            
            // 使用事件委托处理题目选项点击
            document.getElementById('question-container').addEventListener('click', (e) => {
                // 处理量表题选项
                const scaleEl = e.target.closest('.scale-option');
                if (scaleEl) {
                    e.preventDefault();
                    e.stopPropagation();
                    const value = parseInt(scaleEl.dataset.value);
                    console.log('量表题选项被点击:', value);
                    selectScale(value);
                    return;
                }
                
                // 处理选择题选项
                const choiceEl = e.target.closest('.choice-option');
                if (choiceEl) {
                    e.preventDefault();
                    e.stopPropagation();
                    const option = choiceEl.dataset.option;
                    console.log('选择题选项被点击:', option);
                    toggleChoice(option);
                }
            });
        });
    </script>

    <!-- 页脚 -->
    <footer style="text-align: center; padding: 40px 20px; margin-top: 40px; background: linear-gradient(to bottom, transparent, rgba(255,140,148,0.05)); border-top: 1px solid rgba(255,140,148,0.1);">
        <div style="max-width: 800px; margin: 0 auto;">
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 8px;">
                <span style="font-weight: 600; color: var(--primary-color);">心理测试</span> © 2026 起源研究社 Origin Lab
            </p>
            <p style="color: #aaa; font-size: 0.75rem; margin: 0; line-height: 1.6;">
                保留所有权利 | 仅供娱乐参考，不构成专业建议
            </p>
        </div>
    </footer>
</body>
</html>
